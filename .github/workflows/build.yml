name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          # links the package to this repository on ghcr
          labels: org.opencontainers.image.source=https://github.com/epheo/dotvirt.io
          # the cluster runs the sha tag; latest is for humans
          tags: |
            ghcr.io/epheo/dotvirt-io:latest
            ghcr.io/epheo/dotvirt-io:${{ github.sha }}
